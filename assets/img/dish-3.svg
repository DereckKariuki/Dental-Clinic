<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Prawns seared on the tawa">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22241b"/><stop offset="100%" stop-color="#3a2f22"/>
    </linearGradient>
    <radialGradient id="t-pan" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#40342c"/><stop offset="100%" stop-color="#1d1713"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#t-bg)"/>
  <ellipse cx="240" cy="196" rx="152" ry="146" fill="#0f0b09" opacity=".4"/>
  <circle cx="240" cy="184" r="146" fill="#2a221c"/>
  <circle cx="240" cy="184" r="132" fill="url(#t-pan)"/>
  <circle cx="240" cy="184" r="132" fill="none" stroke="#584637" stroke-width="4"/>

  <!-- prawns -->
