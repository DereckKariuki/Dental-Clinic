<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A jiko-fired pizza, blistered at the edges">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b211b"/><stop offset="100%" stop-color="#4a382c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#p-bg)"/>
  <ellipse cx="240" cy="192" rx="140" ry="136" fill="#0f0b09" opacity=".35"/>
  <circle cx="240" cy="180" r="136" fill="#e8c98d"/>
  <circle cx="240" cy="180" r="120" fill="#f0d9a8"/>
  <circle cx="240" cy="180" r="106" fill="#c0442a"/>
  <circle cx="240" cy="180" r="98" fill="#cf5a34"/>
  <!-- mozzarella -->
  <g fill="#fdf6e4">
    <ellipse cx="205" cy="145" rx="26" ry="20"/><ellipse cx="272" cy="160" rx="22" ry="17"/>
    <ellipse cx="222" cy="216" rx="24" ry="18"/><ellipse cx="285" cy="215" rx="18" ry="14"/>
    <ellipse cx="180" cy="192" rx="16" ry="13"/><ellipse cx="252" cy="118" rx="15" ry="12"/>
  </g>
  <!-- basil -->
  <g fill="#4f7a45">
    <ellipse cx="252" cy="188" rx="17" ry="10" transform="rotate(-24 252 188)"/>
    <ellipse cx="196" cy="122" rx="13" ry="8" transform="rotate(18 196 122)"/>
    <ellipse cx="296" cy="188" rx="12" ry="7" transform="rotate(40 296 188)"/>
  </g>
  <!-- char spots from the jiko -->
  <g fill="#5c3418" opacity=".72">
    <circle cx="150" cy="140" r="9"/><circle cx="330" cy="150" r="7"/>
    <circle cx="318" cy="248" r="8"/><circle cx="162" cy="248" r="6"/>
    <circle cx="240" cy="292" r="7"/><circle cx="240" cy="62" r="6"/>
  </g>
</svg>
