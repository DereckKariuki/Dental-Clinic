[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dentaldesk"
version = "0.1.0"
description = "Testing, list-building and webhook tooling for the Kenya dental AI front desk"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dentaldesk-eval = "dentaldesk.evaluate:main"
dentaldesk-qualify = "dentaldesk.prospecting.qualify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
